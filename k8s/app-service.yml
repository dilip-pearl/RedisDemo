apiVersion: v1
kind: Service

metadata:
  name: redisdemo-service

spec:
  type: NodePort

  selector:
    app: redisdemo

  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080

    - name: https
      protocol: TCP
      port: 8081
      targetPort: 8081
      nodePort: 30443