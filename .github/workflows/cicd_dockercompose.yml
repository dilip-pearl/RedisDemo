name: Build and Deploy with Docker Compose

on:
  push:
    branches: [ "master" ]   # run on pushes to master

jobs:
  build-and-deploy:
    runs-on: self-hosted    # runs on your Windows runner, not GitHub cloud
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker (optional if pushing to registry)
        run: |
          echo "No Docker login needed, running locally"

      - name: Stop old containers
        run: |
          docker compose down

      - name: Build and start containers
        run: |
          docker compose up -d --build
